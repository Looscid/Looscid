name: Cleanup branches (temporary)

on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Delete stale branches and report each result
        run: |
          for b in onboarding-unified-v2 onboarding-unified d1-feed dreamos-may9 profileedit settingsios27 dreamboard-classic; do
            if [ "$b" = "main" ] || [ "$b" = "beta" ]; then echo "SKIP $b"; continue; fi
            if git push origin --delete "$b"; then echo "DELETED $b"; else echo "FAILED $b"; fi
          done
          echo "Remaining remote branches:"
          git ls-remote --heads origin

      - name: Remove this temporary workflow file
        run: |
          set -e
          git checkout beta
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "Remove temporary cleanup workflow"
          git push origin HEAD:refs/heads/beta
