name: Cleanup branches (temporary)

on:
  push:
    branches:
      - DEV

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push HEAD to beta
        run: |
          set -e
          git push origin HEAD:refs/heads/beta
          git fetch origin beta
          echo "HEAD=$(git rev-parse HEAD) beta=$(git rev-parse origin/beta)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/beta)"

      - name: Delete stale branches
        run: |
          git push origin --delete onboarding-unified-v2 onboarding-unified d1-feed dreamos-may9 profileedit settingsios27 || true

      - name: Delete DEV only if beta matches HEAD
        run: |
          set -e
          git fetch origin beta
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/beta)"
          git push origin --delete DEV || true
