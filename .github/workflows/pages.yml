name: Deploy Looscid to GitHub Pages

# Publishes the app/ folder as the site, so the address stays https://looscid.github.io/Looscid/
# with no /app in it. Pages' source is set to GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # #161: the changelog page (app/changelog/) reads the site's own copy of CHANGELOG.md.
      - name: Put CHANGELOG.md on the site
        run: cp CHANGELOG.md app/CHANGELOG.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
