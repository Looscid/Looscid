name: Deploy Looscid to GitHub Pages

# Publishes the app/ folder as the site, so the address stays https://looscid.github.io/Looscid/
# with no /app in it. Pages' source is set to GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # #161: the changelog page (app/changelog/) reads the site's own copy of CHANGELOG.md.
      - name: Put CHANGELOG.md on the site
        run: cp CHANGELOG.md app/CHANGELOG.md
      # Build 195: the Help Center website lives in app/help-center/ (made by .github/scripts/build-help.mjs) and is
      # published at /help/, as Carter asked. It can't be called help in the repo: app/Help/ (the Help link card) already
      # exists, and on Mac and Windows help and Help are the same folder. GitHub Pages tells them apart, so both work.
      - name: Put the Help Center at /help/
        run: cp -r app/help-center app/help
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
