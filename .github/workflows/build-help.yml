name: Build Help Center

# Runs .github/scripts/build-help.mjs whenever the Help Center's words or its builder change, then commits
# the regenerated files back to main. The Deploy Looscid to GitHub Pages workflow publishes them after that push.

on:
  push:
    branches: [main]
    paths:
      - "app/js/helpdata.js"
      - ".github/scripts/**"
      - "app/js/sitefooter.js"
      - "app/js/core.js"
      - "app/js/aboutdata.js"
      - "app/version.json"
      - "app/changelog/index.html"
      - "app/status.html"
      - "app/404.html"
      - "docs/**"
      - "LICENSE"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-help
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the Help Center
        run: node .github/scripts/build-help.mjs

      - name: Check the Help Center is up to date
        run: node .github/scripts/build-help.mjs --check

      - name: Commit regenerated Help Center files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only what the build script writes: the Help Center pages, the About and Why pages, the app's About data,
          # and the footers on the changelog, status and 404 pages.
          git add app/help-center app/About app/Why app/js/aboutdata.js app/changelog/index.html app/status.html app/404.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild Help Center from helpdata.js [skip ci]"
            git push origin HEAD:main
          fi
