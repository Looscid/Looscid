<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DO IT ALL. ON DREAMOS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 3.8rem;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #00ccff, #ff00cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.35rem;
            max-width: 660px;
            margin: 0 auto 40px;
            opacity: 0.9;
            line-height: 1.6;
        }
        .slogan {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 30px 0 40px;
            color: #00ffaa;
            letter-spacing: 2px;
        }
        .links a {
            color: #00ccff;
            text-decoration: none;
            margin: 0 18px;
            font-weight: 600;
            font-size: 1.15rem;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>DreamOS</h1>
    <p>A free, open-source social platform and web-based OS experience.<br>
       Built for accessibility, privacy, and freedom.</p>
    <div class="slogan">DO IT ALL. ON DREAMOS</div>
    
    <div class="links">
        <a href="https://dreamosofficial.github.io/DreamOS/">🚀 Launch DreamOS</a>
        <a href="https://github.com/DreamOSOfficial/DreamOS">GitHub</a>
        <a href="https://x.com/dreamOS26">X / Twitter</a>
    </div>
</body>
</html>
