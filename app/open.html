<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!-- Security pass (Oct 2026): a page under os/ or projects/ opened on its own lands here (js/appguard.js sends it), and runs in
     a sandboxed frame, so it can't reach Looscid's storage or your Nostr key. No inline script; frame-busting is in js/open.js.
     Round 10 fixes: frame-src allows blob: (as index.html does) so a sandboxed app's own file downloads work in iPhone browsers,
     which check a download from a sandboxed frame against this page's frame-src. The blob has the app's anonymous origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' blob:; connect-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Looscid</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<style>
html,body{margin:0;height:100%;background:#0d0d12;color:#f2f2f5;font:16px/1.4 -apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #2a2a33}
header h1{font-size:17px;margin:0;flex:1}
header a{color:#ffd400;font-weight:600;padding:8px 4px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
iframe{border:0;flex:1;width:100%;min-height:0;background:#fff}
#msg{padding:16px;margin:0}
</style>
<script src="js/apphost.js"></script>
<script src="js/open.js" defer></script>
</head>
<body>
<header><h1 id="lc-open-h" tabindex="-1">Looscid</h1><a href="./">Back to Looscid</a></header>
<main><p id="msg" hidden></p></main>
</body>
</html>
